<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Paiement · Amore di Sicilia</title>
<link rel="icon" href="/img/logo.webp">
<style>
:root{--sapin:#0E3F24;--bord:#9D0E20;--creme:#FFF8EC}
*{box-sizing:border-box}
body{margin:0;background:var(--creme);color:var(--sapin);font:16px/1.55 Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.carte{background:#fff;border-radius:22px;max-width:480px;width:100%;padding:32px 24px;text-align:center;box-shadow:0 10px 30px rgba(14,63,36,.08)}
img{width:84px;height:84px;border-radius:50%}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.8rem;line-height:1.2;margin:16px 0 10px}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:16px 20px;font:800 1rem/1 Helvetica,Arial,sans-serif;text-decoration:none;cursor:pointer;margin-top:12px}
.wa{background:#1FAF55;color:#fff}.sms{background:var(--sapin);color:var(--creme)}.retour{background:var(--bord);color:var(--creme)}
.ref{font-size:.9rem;color:#4F6A59;margin-top:14px}
.ticket{text-align:left;margin:20px 0 6px;border:1px dashed #C9B89A;border-radius:14px;padding:16px 16px 12px;background:#FFFDF8;font-size:.92rem}
.ticket h2{font:800 .8rem/1.2 Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin:0 0 4px;color:var(--bord);text-align:center}
.ticket .entete{text-align:center;color:#4F6A59;font-size:.82rem;margin-bottom:10px}
.ticket .l{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.ticket .l span:last-child{white-space:nowrap}
.ticket .tot{border-top:1px dashed #C9B89A;margin-top:8px;padding-top:8px;font-weight:800;font-size:1.05rem}
.ticket .info{color:#4F6A59;font-size:.82rem;margin-top:8px;white-space:pre-line}
.alerte{background:var(--bord);color:var(--creme);border-radius:16px;padding:14px 16px;margin:14px 0 4px;font-size:1.02rem;line-height:1.45;text-align:left}
.alerte b{font-size:1.1rem}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(31,175,85,.55)}50%{transform:scale(1.03);box-shadow:0 0 0 12px rgba(31,175,85,0)}}
.voile{position:fixed;inset:0;background:rgba(14,63,36,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.voile .boite{background:#fff;border-radius:22px;max-width:420px;width:100%;padding:26px 22px;text-align:center}
.voile h2{font-family:Georgia,serif;font-size:1.5rem;margin:6px 0 8px;color:var(--bord)}
.voile .plus-tard{background:none;border:0;color:#4F6A59;text-decoration:underline;margin-top:14px;font-size:.9rem;cursor:pointer}
.imprimer{background:#fff;color:var(--sapin);border:2px solid var(--sapin)}
@media print{body{background:#fff;padding:0}.carte{box-shadow:none}#actions,.noprint{display:none!important}}
</style>
</head>
<body>
<main class="carte">
  <img src="/img/logo.webp" alt="Amore di Sicilia">
  <h1 id="titre">Vérification du paiement…</h1>
  <p id="texte">Un instant, nous vérifions votre paiement auprès de SumUp.</p>
  <div id="actions"></div>
  <div id="ticket"></div>
  <p class="ref" id="ref"></p>
</main>
<script>
(function(){
  var PAY_URL='https://ads-paiement.amoredisicilia-traiteur.workers.dev',TEL='33676818903';
  var T=document.getElementById('titre'),X=document.getElementById('texte'),A=document.getElementById('actions'),R=document.getElementById('ref');
  var c=null;try{c=JSON.parse(localStorage.getItem('amore-paiement')||'null')}catch(e){}
  // Autre navigateur (ex. retour depuis l'appli de la banque) : on tente l'identifiant passé dans l'adresse
  var Q=new URLSearchParams(location.search),qid=Q.get('checkout_id')||Q.get('id'),qref=Q.get('ref')||'';
  if(qref&&c&&c.ref&&c.ref!==qref)c=null; // ancienne commande restée sur l'appareil
  if((!c||!c.id)&&(qid||qref))c={id:qid||'',ref:qref,msg:''};
  function eur(n){return Number(n).toFixed(2).replace('.',',')+' €'}
  if(!c||!(c.id||c.ref)){T.textContent='Commande introuvable';X.textContent='Nous ne retrouvons pas votre commande sur cet appareil. Si vous avez payé, appelez-nous au 06 76 81 89 03.';A.innerHTML='<a class="btn retour" href="/commander/">Retour à la commande</a>';return}
  if(c.ref)R.textContent='Référence : '+c.ref;
  function esc(t){return String(t).replace(/[&<>"]/g,function(x){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]})}
  // Reçu de commande affiché à l'écran (à enregistrer en PDF / capture), stocké sur l'appareil
  function ticket(d){
    var lignes=[],info=[],quand=new Date(c.t||Date.now());
    (c.msg||'').split('\n').forEach(function(x){
      var m=x.match(/^•\s*(.+?)\s+—\s+([\d,]+ €)$/);if(m){lignes.push('<div class="l"><span>'+esc(m[1])+'</span><span>'+esc(m[2])+'</span></div>');return}
      var o=x.match(/^🎁 (.+?) — (−[\d,]+ €)$/);if(o){lignes.push('<div class="l"><span>🎁 '+esc(o[1])+'</span><span>'+esc(o[2])+'</span></div>');return}
      if(/^(Retrait|Nom|Remarque) :/.test(x))info.push(x);
    });
    document.getElementById('ticket').innerHTML='<div class="ticket"><h2>Reçu de commande</h2><div class="entete">Amore di Sicilia · 25 rue des Vieilles Postes, 51470 Saint-Memmie · 06 76 81 89 03<br>'+
      quand.toLocaleDateString('fr-FR')+' à '+quand.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+' · Réf. '+esc(c.ref||'')+'</div>'+
      (lignes.length?lignes.join(''):'<div class="info">Détail de la commande non disponible sur cet appareil.</div>')+
      '<div class="l tot"><span>Total payé par carte (SumUp)</span><span>'+eur(d.montant)+'</span></div>'+
      (info.length?'<div class="info">'+esc(info.join('\n'))+'</div>':'')+
      '<div class="info">Le ticket de caisse vous est remis au retrait de la commande.</div></div>'+
      '<button class="btn imprimer noprint" type="button" onclick="window.print()">📄 Enregistrer / imprimer mon reçu</button>';
  }
  var essais=0,MAX=40; // ≈ 2 minutes (3D Secure parfois lent)
  function verifier(){
    fetch(PAY_URL+'/statut?'+(c.id?'id='+encodeURIComponent(c.id):'ref='+encodeURIComponent(c.ref))).then(function(r){return r.json()}).then(function(d){
      if(d.erreur){T.textContent='Vérification impossible';X.textContent='Si vous avez payé, appelez-nous au 06 76 81 89 03 en donnant la référence ci-dessous.';A.innerHTML='<a class="btn retour" href="/commander/">Retour à la commande</a>';return}
      if(d.ref&&!c.ref){c.ref=d.ref;R.textContent='Référence : '+d.ref}if(d.id&&!c.id)c.id=d.id;
      if(d.statut==='PAID'){
        var m='✅ COMMANDE PAYÉE EN LIGNE — '+eur(d.montant)+' (réf. '+c.ref+')'+(c.msg?'\n\n'+c.msg:'\n\n(Détail de la commande perdu au changement de navigateur — merci de le préciser)');
        T.textContent='Paiement reçu, grazie !';
        ticket(d);
        var urlWa='https://wa.me/'+TEL+'?text='+encodeURIComponent(m),urlSms='sms:+'+TEL+(/iPhone|iPad|iPod/.test(navigator.userAgent)?'&':'?')+'body='+encodeURIComponent(m);
        X.innerHTML='';
        A.innerHTML='<div class="alerte">⚠️ <b>Votre commande n\'est pas encore envoyée !</b><br>Appuyez sur le bouton vert, puis sur <b>Envoyer</b> dans WhatsApp, pour qu\'Oneta la prépare.</div>'+
          '<a class="btn wa pulse" id="wa" href="'+urlWa+'">📲 Envoyer ma commande par WhatsApp</a><a class="btn sms" href="'+urlSms+'">Envoyer par SMS</a>';
        // Fenêtre bloquante : tant que le client n'a pas appuyé sur WhatsApp ou SMS
        var cleE='amore-envoyee-'+(c.id||c.ref),envoyee=false;try{envoyee=!!localStorage.getItem(cleE)}catch(e){}
        function marquer(){try{localStorage.setItem(cleE,'1')}catch(e){}var v=document.getElementById('voile');if(v)v.remove()}
        A.querySelectorAll('a').forEach(function(a){a.addEventListener('click',marquer)});
        if(!envoyee){var v=document.createElement('div');v.className='voile';v.id='voile';
          v.innerHTML='<div class="boite"><div style="font-size:2.4rem">⚠️</div><h2>Dernière étape !</h2><p>Paiement reçu ✅ mais <b>votre commande n\'est pas encore envoyée</b>.<br>Appuyez sur le bouton, puis sur <b>Envoyer</b>.</p>'+
          '<a class="btn wa pulse" href="'+urlWa+'">📲 Envoyer ma commande par WhatsApp</a><a class="btn sms" href="'+urlSms+'">Envoyer par SMS</a><button class="plus-tard" type="button">Voir mon reçu</button></div>';
          document.body.appendChild(v);v.querySelectorAll('a').forEach(function(a){a.addEventListener('click',marquer)});
          v.querySelector('.plus-tard').addEventListener('click',function(){v.remove()});}
        // Notification de la commande payée (application ntfy de Gianni / Oneta) — envoyée depuis le navigateur du client
        var cleN='amore-notif-'+(c.id||c.ref),dejaN=false;try{dejaN=!!localStorage.getItem(cleN)}catch(e){}
        function transmise(){} // le client doit toujours envoyer la commande par WhatsApp ou SMS
        if(dejaN)transmise();
        else fetch('https://ntfy.sh/',{method:'POST',body:JSON.stringify({topic:'amore-commandes-k7q2xw9m4t',title:'Commande payée '+eur(d.montant)+' — réf. '+c.ref,message:m,priority:5,tags:['pizza']})}).then(function(r){if(!r.ok)return;
          try{localStorage.setItem(cleN,'1')}catch(e){}transmise();}).catch(function(){});
        try{localStorage.removeItem('amore-panier2');var s=JSON.parse(localStorage.getItem('amore-paiement')||'null');if(s){s.vu=1;localStorage.setItem('amore-paiement',JSON.stringify(s))}}catch(e){}
      }else if((d.statut==='PENDING'||!d.statut)&&essais++<MAX){
        if(essais===5){X.textContent='Votre banque met un peu de temps à confirmer, ne fermez pas cette page…'}
        setTimeout(verifier,3000);
      }
      else{
        T.textContent='Paiement non abouti';
        X.textContent='Votre carte n\'a pas été débitée. Vous pouvez réessayer, ou envoyer la commande et payer au retrait.';
        A.innerHTML='<a class="btn retour" href="/commander/">Revenir à ma commande</a>'+(c.msg?'<a class="btn wa" href="https://wa.me/'+TEL+'?text='+encodeURIComponent(c.msg+'\n\n💳 Paiement en ligne non abouti — paiement au retrait')+'">Commander et payer au retrait</a>':'');
        try{var s=JSON.parse(localStorage.getItem('amore-paiement')||'null');if(s){s.vu=1;localStorage.setItem('amore-paiement',JSON.stringify(s))}}catch(e){}
      }
    }).catch(function(){if(essais++<MAX)setTimeout(verifier,3000);else{T.textContent='Vérification impossible';X.textContent='Appelez-nous au 06 76 81 89 03 en donnant la référence ci-dessous.'}});
  }
  verifier();
})();
</script>
</body>
</html>

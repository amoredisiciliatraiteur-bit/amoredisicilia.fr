<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Paiement · Amore di Sicilia</title>
<link rel="icon" href="/img/logo.webp">
<style>
:root{--sapin:#0E3F24;--bord:#9D0E20;--creme:#FFF8EC}
*{box-sizing:border-box}
body{margin:0;background:var(--creme);color:var(--sapin);font:16px/1.55 Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.carte{background:#fff;border-radius:22px;max-width:480px;width:100%;padding:32px 24px;text-align:center;box-shadow:0 10px 30px rgba(14,63,36,.08)}
img{width:84px;height:84px;border-radius:50%}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.8rem;line-height:1.2;margin:16px 0 10px}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:16px 20px;font:800 1rem/1 Helvetica,Arial,sans-serif;text-decoration:none;cursor:pointer;margin-top:12px}
.wa{background:#1FAF55;color:#fff}.sms{background:var(--sapin);color:var(--creme)}.retour{background:var(--bord);color:var(--creme)}
.ref{font-size:.9rem;color:#4F6A59;margin-top:14px}
</style>
</head>
<body>
<main class="carte">
  <img src="/img/logo.webp" alt="Amore di Sicilia">
  <h1 id="titre">Vérification du paiement…</h1>
  <p id="texte">Un instant, nous vérifions votre paiement auprès de SumUp.</p>
  <div id="actions"></div>
  <p class="ref" id="ref"></p>
</main>
<script>
(function(){
  var PAY_URL='https://ads-paiement.amoredisicilia-traiteur.workers.dev',TEL='33676818903';
  var T=document.getElementById('titre'),X=document.getElementById('texte'),A=document.getElementById('actions'),R=document.getElementById('ref');
  var c=null;try{c=JSON.parse(localStorage.getItem('amore-paiement')||'null')}catch(e){}
  // Autre navigateur (ex. retour depuis l'appli de la banque) : on tente l'identifiant passé dans l'adresse
  var Q=new URLSearchParams(location.search),qid=Q.get('checkout_id')||Q.get('id'),qref=Q.get('ref')||'';
  if(qref&&c&&c.ref&&c.ref!==qref)c=null; // ancienne commande restée sur l'appareil
  if((!c||!c.id)&&(qid||qref))c={id:qid||'',ref:qref,msg:''};
  function eur(n){return Number(n).toFixed(2).replace('.',',')+' €'}
  if(!c||!(c.id||c.ref)){T.textContent='Commande introuvable';X.textContent='Nous ne retrouvons pas votre commande sur cet appareil. Si vous avez payé, appelez-nous au 06 76 81 89 03.';A.innerHTML='<a class="btn retour" href="/commander/">Retour à la commande</a>';return}
  if(c.ref)R.textContent='Référence : '+c.ref;
  var essais=0,MAX=40; // ≈ 2 minutes (3D Secure parfois lent)
  function verifier(){
    fetch(PAY_URL+'/statut?'+(c.id?'id='+encodeURIComponent(c.id):'ref='+encodeURIComponent(c.ref))).then(function(r){return r.json()}).then(function(d){
      if(d.erreur){T.textContent='Vérification impossible';X.textContent='Si vous avez payé, appelez-nous au 06 76 81 89 03 en donnant la référence ci-dessous.';A.innerHTML='<a class="btn retour" href="/commander/">Retour à la commande</a>';return}
      if(d.ref&&!c.ref){c.ref=d.ref;R.textContent='Référence : '+d.ref}if(d.id&&!c.id)c.id=d.id;
      if(d.statut==='PAID'){
        var m='✅ COMMANDE PAYÉE EN LIGNE — '+eur(d.montant)+' (réf. '+c.ref+')'+(c.msg?'\n\n'+c.msg:'\n\n(Détail de la commande perdu au changement de navigateur — merci de le préciser)');
        T.textContent='Paiement reçu, grazie !';
        X.innerHTML='Dernière étape : <b>envoyez-nous la commande</b> pour qu\'Oneta la prépare à l\'heure choisie.';
        A.innerHTML='<a class="btn wa" id="wa" href="https://wa.me/'+TEL+'?text='+encodeURIComponent(m)+'">Envoyer ma commande par WhatsApp</a><a class="btn sms" href="sms:+'+TEL+(/iPhone|iPad|iPod/.test(navigator.userAgent)?'&':'?')+'body='+encodeURIComponent(m)+'">Envoyer par SMS</a>';
        // Notification de la commande payée (application ntfy de Gianni / Oneta) — envoyée depuis le navigateur du client
        var cleN='amore-notif-'+(c.id||c.ref),dejaN=false;try{dejaN=!!localStorage.getItem(cleN)}catch(e){}
        function transmise(){if(c.msg){X.innerHTML='Votre commande est <b>transmise à Oneta</b>, rien d\'autre à faire. À tout à l\'heure&nbsp;!';
          A.innerHTML='<a class="btn sms" href="https://wa.me/'+TEL+'?text='+encodeURIComponent(m)+'">Nous écrire sur WhatsApp (facultatif)</a>';}}
        if(dejaN)transmise();
        else fetch('https://ntfy.sh/',{method:'POST',body:JSON.stringify({topic:'amore-commandes-k7q2xw9m4t',title:'Commande payée '+eur(d.montant)+' — réf. '+c.ref,message:m,priority:5,tags:['pizza']})}).then(function(r){if(!r.ok)return;
          try{localStorage.setItem(cleN,'1')}catch(e){}transmise();}).catch(function(){});
        try{localStorage.removeItem('amore-panier2');var s=JSON.parse(localStorage.getItem('amore-paiement')||'null');if(s){s.vu=1;localStorage.setItem('amore-paiement',JSON.stringify(s))}}catch(e){}
      }else if((d.statut==='PENDING'||!d.statut)&&essais++<MAX){
        if(essais===5){X.textContent='Votre banque met un peu de temps à confirmer, ne fermez pas cette page…'}
        setTimeout(verifier,3000);
      }
      else{
        T.textContent='Paiement non abouti';
        X.textContent='Votre carte n\'a pas été débitée. Vous pouvez réessayer, ou envoyer la commande et payer au retrait.';
        A.innerHTML='<a class="btn retour" href="/commander/">Revenir à ma commande</a>'+(c.msg?'<a class="btn wa" href="https://wa.me/'+TEL+'?text='+encodeURIComponent(c.msg+'\n\n💳 Paiement en ligne non abouti — paiement au retrait')+'">Commander et payer au retrait</a>':'');
        try{var s=JSON.parse(localStorage.getItem('amore-paiement')||'null');if(s){s.vu=1;localStorage.setItem('amore-paiement',JSON.stringify(s))}}catch(e){}
      }
    }).catch(function(){if(essais++<MAX)setTimeout(verifier,3000);else{T.textContent='Vérification impossible';X.textContent='Appelez-nous au 06 76 81 89 03 en donnant la référence ci-dessous.'}});
  }
  verifier();
})();
</script>
</body>
</html>
